name: CI

# Local quality gates run via git pre-commit (scripts/pre-commit).
# GitHub CI is daily only (plus manual dispatch) to save Actions minutes.
on:
  schedule:
    # 06:00 UTC daily
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build (Node)
        run: npm run build:node

      - name: Run minimal unit tests
        run: npm run test:unit

      - name: Run VDF smoke (verify only)
        run: npm run test:smoke

      - name: Golden vector verify (Jest slow subset)
        run: npm run test:slow

      - name: Bench smoke (no regression gate)
        run: BENCH_RUNS=1 BENCH_WARMUP=0 npm run bench

      # Soft regression caps (generous) — fail only on catastrophic slowdowns (#6/#8)
      - name: Bench regression thresholds
        run: >
          BENCH_RUNS=3 BENCH_WARMUP=1 BENCH_FAIL_ON_REGRESSION=1
          BENCH_MAX_MS_JSON='{"wesolowski-256-solve":60000,"wesolowski-256-verify":30000,"pietrzak-256-solve":60000,"pietrzak-256-verify":30000}'
          npm run bench

      # Full VDF matrix is slow — run locally or on release, not every daily run
      # npm run test:comprehensive
      # 2048-bit solve is heavy; verify path covered via precomputed discriminant unit tests

  # Aggregate gate so branch protection can require a single check name
  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: All matrix jobs passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test matrix result: ${{ needs.test.result }}"
            exit 1
          fi
